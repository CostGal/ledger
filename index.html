<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<title>Ledger</title>
<!-- Relative hrefs: the same files are served both under /ledger/ and at a host root. -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" type="image/png">
<style>
  :root{
    --bg:#000; --card:#141413; --card2:#1D1D1B; --rule:#2C2C29;
    --ink:#EFEFED; --ink2:#8C8C86; --acc:#D97757; --acc-soft:#2B1A14;
    --bad:#E5484D; --bad-soft:#2B1214;
    --fut:"Futura","Futura PT","Avenir Next",Avenir,"Century Gothic",system-ui,sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation}
  html{background:var(--bg); -webkit-text-size-adjust:100%}
  body{
    margin:0;
    padding:calc(env(safe-area-inset-top) + 18px)
            calc(env(safe-area-inset-right) + 16px)
            calc(env(safe-area-inset-bottom) + 96px)
            calc(env(safe-area-inset-left) + 16px);
    background:var(--bg); color:var(--ink);
    font-family:var(--fut); font-size:16px; line-height:1.45; letter-spacing:.005em;
    max-width:560px; margin-inline:auto;
    -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
  }
  h1,h2{margin:0; font-weight:500}
  button{font-family:inherit; -webkit-user-select:none; user-select:none; cursor:pointer; color:var(--ink)}
  button:active{opacity:.65}
  input,select,textarea{font-family:inherit; font-size:16px; color:var(--ink); background:var(--card2); border:1px solid var(--rule); border-radius:10px}
  input,select{padding:11px 12px}
  ::placeholder{color:#5E5E57}

  .topbar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px}
  .topbar h1{font-size:22px; letter-spacing:.06em; text-transform:uppercase}
  .nav{display:flex; gap:6px; flex:none; align-items:center}
  .nav button{
    font-size:19px; width:46px; height:44px; color:var(--ink2); line-height:1;
    background:var(--card); border:1px solid var(--rule); border-radius:10px;
  }
  .nav button:disabled{opacity:.28}
  .nav .today{width:auto; padding:0 14px; font-size:14px; color:var(--acc)}
  .viewhead{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:2px 0 16px}
  .viewhead h2{font-size:20px; letter-spacing:.01em}
  .viewhead .sub{font-size:13px; color:var(--ink2)}
  input[type=date]{background:var(--card); border:1px solid var(--rule); color:var(--ink2); padding:8px 10px; font-size:14px; -webkit-appearance:none; appearance:none}

  .status{
    margin:0 0 22px; padding:15px 16px; background:var(--card);
    border:1px solid var(--rule); border-left:3px solid var(--acc);
    border-radius:10px; font-size:15px; line-height:1.5; color:var(--ink2);
  }
  .status b{color:var(--ink); font-weight:500}
  .status.alarm{border-left-color:var(--bad)}
  .status .bad{color:var(--bad)}

  section{margin-bottom:32px}
  .head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:13px; padding-bottom:9px; border-bottom:1px solid var(--rule)}
  .head h2{font-size:13px; letter-spacing:.16em; color:var(--ink2); text-transform:uppercase}
  .head .sub{font-size:13px; color:var(--ink2)}
  .headbtn{font-size:14px; color:var(--acc); background:none; border:0; padding:6px 0 6px 14px; min-height:34px}

  .toggles{display:flex; flex-direction:column; gap:8px}
  .tog{
    position:relative; display:flex; align-items:center; gap:14px; width:100%; min-height:56px;
    padding:15px 16px; background:var(--card); text-align:left;
    border:1px solid var(--rule); border-radius:12px; font-size:17px;
  }
  .tog .box{flex:none; width:24px; height:24px; border:1.5px solid #40403B; border-radius:7px; display:grid; place-items:center; font-size:14px; color:transparent}
  .tog .sub{margin-left:auto; font-size:13px; color:var(--ink2)}
  .tog[aria-pressed="true"]{border-color:var(--acc); background:var(--acc-soft)}
  .tog[aria-pressed="true"] .box{background:var(--acc); border-color:var(--acc); color:#100E0D}

  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{position:relative; display:inline-flex; align-items:stretch; overflow:hidden; min-height:52px; background:var(--card); border:1px solid var(--rule); border-radius:16px}
  /* A save that failed shows this on its chip/toggle until it retries successfully.
     Deliberate one-off exception to "red = exceeded ceiling only": the dot is red,
     the badge itself is off-white so it never reads as a ceiling warning. */
  .unsaved{position:absolute; top:6px; right:6px; width:13px; height:13px; border-radius:50%;
    background:var(--ink); display:grid; place-items:center; pointer-events:none}
  .unsaved::after{content:''; width:5px; height:5px; border-radius:50%; background:var(--bad)}
  .chip .lbl{display:flex; align-items:center; gap:10px; padding:6px 16px; background:none; border:0; font-size:16px; text-align:left}
  .chip .txt{display:flex; flex-direction:column; align-items:flex-start; gap:1px}
  .chip .prog{font-size:11.5px; color:var(--ink2); letter-spacing:.02em}
  .chip .n{min-width:22px; height:22px; padding:0 6px; border-radius:11px; background:#3C3C37; font-size:12.5px; line-height:22px; text-align:center}
  .chip.met{border-color:var(--acc); background:var(--acc-soft)}
  .chip.met .n{background:var(--acc); color:#100E0D}
  .chip.over{border-color:var(--bad); background:var(--bad-soft)}
  .chip.over .n{background:var(--bad); color:#fff}
  .chip .minus{font-size:20px; color:var(--ink2); background:var(--card2); border:0; padding:0 15px; border-right:1px solid var(--rule); line-height:1}

  .daystrip{display:flex; gap:6px; margin-bottom:18px}
  .daystrip button{flex:1; min-height:44px; font-size:13px; color:var(--ink2); background:var(--card); border:1px solid var(--rule); border-radius:9px}
  .daystrip button.on{color:var(--acc); border-color:var(--acc)}

  .row{display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--rule)}
  .row:last-child{border-bottom:0}
  .row .name{flex:1; display:flex; align-items:center; font-size:16px; min-width:0}
  .row .name .nametext{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
  .row.tap{cursor:pointer}
  .dots{display:flex; gap:5px; flex:none}
  .dots i{width:7px; height:7px; border-radius:2px; background:#2E2E2B}
  .dots i.on{background:var(--acc)}
  .dots i.onx{background:#706C66}
  .dots i.bad{background:var(--bad)}
  .dots i.today{outline:1px solid #57554F; outline-offset:3px}
  .tally{flex:none; min-width:76px; text-align:right; font-size:14px; color:var(--ink2)}
  .tally.met{color:var(--acc)}
  .tally.over{color:var(--bad)}

  .heat{margin:4px 0 10px; padding:12px; background:var(--card); border:1px solid var(--rule); border-radius:10px}
  .heat .grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px}
  .heat .cell{aspect-ratio:1; border-radius:5px; background:#232321; display:grid; place-items:center; font-size:10.5px; color:#100E0D}
  .heat .cell.h{background:var(--acc)}
  .heat .cell.hx{background:var(--bad); color:#fff}
  .heat .dow{aspect-ratio:auto; background:none; color:var(--ink2); font-size:10.5px}
  .heat .cell.out{background:transparent}

  .ask{font-size:17px; margin:0 0 14px; line-height:1.35}
  .scale{display:flex; gap:8px}
  .scale button{flex:1; min-height:52px; font-size:17px; color:var(--ink2); background:var(--card); border:1px solid var(--rule); border-radius:12px}
  .scale button[aria-pressed="true"]{background:var(--acc); border-color:var(--acc); color:#100E0D}
  .scalekey{display:flex; justify-content:space-between; font-size:12.5px; color:#6A6A62; margin-top:9px}
  textarea{width:100%; margin-top:14px; min-height:84px; padding:14px; line-height:1.45; resize:vertical; -webkit-user-select:text; user-select:text}

  .form{display:flex; flex-direction:column; gap:12px; padding:16px; background:var(--card); border:1px solid var(--rule); border-radius:12px; margin-bottom:16px}
  .form label{font-size:12.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink2); display:flex; flex-direction:column; gap:6px}
  .formrow{display:flex; gap:10px}
  .formrow .grow{flex:1; min-width:0}
  .formrow .iconfield{flex:none; width:72px}
  .formrow .iconfield input{text-align:center; font-size:20px}
  /* Emoji marker next to an entry's name — sits to the right of the name,
     never in the name field itself. Emoji carry their own color regardless
     of font, so this doesn't add a new color literal to the palette. */
  .icon{margin-left:6px; flex:none}
  .btnrow{display:flex; gap:8px}
  .btnrow button{flex:1; min-height:50px; font-size:15px; background:var(--card2); border:1px solid var(--rule); border-radius:11px}
  .btnrow button.pri{background:var(--acc); border-color:var(--acc); color:#100E0D}
  .btnrow button.danger{color:var(--bad); border-color:#4A2325}
  .mut{font-size:13px; color:var(--ink2); line-height:1.5}
  .msg{font-size:13.5px; color:var(--acc); min-height:18px; margin-top:8px}
  .msg.err{color:var(--bad)}

  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    display:flex; justify-content:center; gap:6px;
    padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);
    background:rgba(0,0,0,.92); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border-top:1px solid var(--rule);
  }
  .tabbar button{
    flex:1; max-width:120px; min-height:48px; font-size:14px; letter-spacing:.04em;
    color:var(--ink2); background:none; border:1px solid transparent; border-radius:11px;
  }
  .tabbar button.on{color:var(--acc); background:var(--acc-soft); border-color:#3A241B}

  .auth{max-width:360px; margin:12vh auto 0; display:flex; flex-direction:column; gap:12px}
  .auth h1{font-size:26px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:8px}
  .auth input{width:100%}
  .authlink{background:none; border:none; min-height:auto; padding:2px 0; align-self:flex-start;
    font-size:13.5px; color:var(--ink2); text-decoration:underline}
  #toast{position:fixed; left:16px; right:16px; bottom:calc(env(safe-area-inset-bottom) + 84px); z-index:20;
    background:var(--bad-soft); border:1px solid var(--bad); color:var(--ink); border-radius:11px;
    padding:12px 14px; font-size:14px; display:none}
  /* Content is never blanked while loading, so this thin bar is the only cue
     that a fetch is in flight. Fixed, so it costs no layout. */
  #load{position:fixed; left:0; top:0; height:2px; width:100%; z-index:30;
    background:var(--acc); transform:scaleX(0); transform-origin:left;
    transition:transform .25s ease-out; pointer-events:none}
  #load.on{transform:scaleX(.9)}
  button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--acc); outline-offset:3px}
</style>

<div id="app"></div>
<div id="load"></div>
<div id="toast"></div>

<script>
/* Which backend this deploy talks to is decided by the hostname.
   costgal.github.io/ledger/       -> sandbox (Kostas only)
   anything else (beta host, local) -> beta (friends)
   Both keys are publishable: RLS + the signup allowlist are the real gate. */
const ENVS={
  sandbox:{url:'https://dgnxbcoxdpdloplkcmzs.supabase.co', key:'sb_publishable_kXCrlX-9S1ud3bs9Zdyt1A_9n-U1X1F'},
  beta:   {url:'https://slejxagvgjoqqkqayiyt.supabase.co', key:'sb_publishable_g-sMnPFYx_laWcDmrUrslg_BtVDFij7'}
};
const ENV_NAME = (location.hostname==='costgal.github.io' && location.pathname.indexOf('/ledger/')===0)
  ? 'sandbox' : 'beta';
const SB_URL=ENVS[ENV_NAME].url;
const SB_KEY=ENVS[ENV_NAME].key;
/* Sessions are keyed per environment so signing into one doesn't clobber the other. */
const SESS_KEY='ledger_session_'+ENV_NAME;
const LAST_EMAIL_KEY='ledger_last_email_'+ENV_NAME;

/* ---------- utils ---------- */
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const DL=['M','T','W','T','F','S','S'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONF=['January','February','March','April','May','June','July','August','September','October','November','December'];
function el(tag, props, ...kids){
  const n=document.createElement(tag);
  if(props) for(const k in props){
    if(k==='class') n.className=props[k];
    else if(k==='html') n.innerHTML=props[k];
    else if(k.slice(0,2)==='on') n[k]=props[k];
    else if(k==='hidden'||k==='disabled'||k==='value'||k==='checked') n[k]=props[k];
    else n.setAttribute(k, props[k]);
  }
  kids.flat().forEach(c=>{ if(c!=null) n.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return n;
}
function key(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseKey(s){ const p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function mondayOf(d){ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function monthStart(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function monthEnd(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0); }
function sameDay(a,b){ return key(a)===key(b); }
function todayD(){ const t=new Date(); t.setHours(0,0,0,0); return t; }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.style.display='block';
  clearTimeout(toast._x); toast._x=setTimeout(()=>t.style.display='none', 4000); }
let busyN=0;
function busy(on){ busyN=Math.max(0, busyN+(on?1:-1));
  document.getElementById('load').classList.toggle('on', busyN>0); }
/* Rebuilds one subtree in place, leaving scroll position, focus and the rest of
   the document alone. build(redraw) returns a fresh node; call redraw() after
   changing state that only that subtree reads. No wrapper element — one would
   break the .chips / .toggles flex layouts. */
function live(build){
  const box={};
  box.redraw=()=>{ const n=build(box.redraw); box.node.replaceWith(n); box.node=n; };
  box.node=build(box.redraw);
  return box.node;
}

/* ---------- auth + api ---------- */
function sess(){ try{ return JSON.parse(localStorage.getItem(SESS_KEY)||'null'); }catch(e){ return null; } }
function setSess(s){ if(s) localStorage.setItem(SESS_KEY, JSON.stringify(s)); else localStorage.removeItem(SESS_KEY); }
async function authReq(path, body){
  const r=await fetch(SB_URL+'/auth/v1/'+path,{method:'POST',
    headers:{apikey:SB_KEY,'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.msg||d.error_description||d.message||('Auth error '+r.status));
  return d;
}
async function authPut(path, body, token){
  const r=await fetch(SB_URL+'/auth/v1/'+path,{method:'PUT',
    headers:{apikey:SB_KEY,'Content-Type':'application/json',Authorization:'Bearer '+token}, body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.msg||d.error_description||d.message||('Auth error '+r.status));
  return d;
}
/* Supabase's recovery email redirects here with the session in the URL
   fragment (never sent to a server) rather than as a query string. */
function recoveryFromHash(){
  const h=location.hash.replace(/^#/,'');
  if(!h) return null;
  const p=new URLSearchParams(h);
  if(p.get('type')!=='recovery' || !p.get('access_token')) return null;
  return {access_token:p.get('access_token'), refresh_token:p.get('refresh_token'),
    expires_in:+p.get('expires_in')||3600, token_type:p.get('token_type')||'bearer'};
}
let refreshing=null;
async function refreshSession(){
  if(refreshing) return refreshing;
  refreshing=(async()=>{
    const s=sess(); if(!s||!s.refresh_token) throw new Error('signed out');
    const d=await authReq('token?grant_type=refresh_token',{refresh_token:s.refresh_token});
    setSess(d); refreshing=null; return d;
  })();
  return refreshing;
}
async function api(path, opts, retry){
  opts=opts||{}; if(retry===undefined) retry=true;
  const s=sess(); if(!s) throw new Error('signed out');
  const r=await fetch(SB_URL+'/rest/v1/'+path,{
    method:opts.method||'GET',
    headers:Object.assign({apikey:SB_KEY, Authorization:'Bearer '+s.access_token,
      'Content-Type':'application/json'}, opts.headers||{}),
    body:opts.body!==undefined?JSON.stringify(opts.body):undefined
  });
  if(r.status===401 && retry){ try{ await refreshSession(); }catch(e){ setSess(null); boot(); throw e; } return api(path,opts,false); }
  if(!r.ok){ const t=await r.text(); throw new Error('DB '+r.status+': '+t.slice(0,140)); }
  if(r.status===204) return [];
  const txt=await r.text(); return txt?JSON.parse(txt):[];
}

/* ---------- data ---------- */
const S={ view:'day', date:todayD(), types:[], logs:{}, loaded:new Set(), refl:{}, editingId:null, showArchived:false, firstRun:false, renderToken:0, recovery:recoveryFromHash() };
if(S.recovery) history.replaceState(null,'',location.pathname+location.search);
function monthKeyOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
async function loadTypes(){ S.types=await api('entry_types?select=*&order=sort.asc,created_at.asc'); }
async function fetchMonth(m){
  const rows=await api('logs?select=entry_type_id,date,count&date=gte.'+key(m)+'&date=lte.'+key(monthEnd(m)));
  rows.forEach(r=>{ if(!S.logs[r.date]) S.logs[r.date]={}; S.logs[r.date][r.entry_type_id]=r.count; });
  S.loaded.add(monthKeyOf(m));
}
/* Months already being fetched, so overlapping callers share one request. The
   day view asks for its month and its week, which usually overlap, and boot
   now fires those concurrently. */
const inflight={};
async function ensureRange(a,b){
  const x=new Date(a.getFullYear(), a.getMonth(), 1), jobs=[];
  while(x<=b){
    const mk=monthKeyOf(x);
    if(!S.loaded.has(mk)){
      if(!inflight[mk]) inflight[mk]=fetchMonth(new Date(x)).finally(()=>{ delete inflight[mk]; });
      jobs.push(inflight[mk]);
    }
    x.setMonth(x.getMonth()+1);
  }
  if(jobs.length) await Promise.all(jobs);
}
/* One write in flight per key, always writing the newest value. Serialising
   matters: two quick taps would otherwise both PATCH (matching no row yet) and
   then both POST, inserting the same (entry_type_id, date) twice. Returns a
   promise so callers that need to stay sequential — runImport — still can.
   A write that fails stays in W with failed=true rather than being dropped,
   so the 'online' handler below can replay it once the connection is back —
   otherwise the UI (already updated optimistically) would silently lie about
   having saved. */
const W={};
function runWrite(k){
  const w=W[k];
  w.busy=true; w.failed=false;
  w.done=(async()=>{
    try{
      let last; while(w.want!==last){ const v=w.want; await w.send(v); last=v; }
      w.busy=false;
    }catch(e){
      w.busy=false; w.failed=true;
      toast(navigator.onLine===false ? 'Offline — will save once back online' : 'Not saved — '+e.message);
    }
  })();
}
function pushWrite(k, want, send){
  const w = W[k] || (W[k]={busy:false, failed:false, done:Promise.resolve()});
  w.want = want; w.send = send;
  if(!w.busy) runWrite(k);
  return w.done;
}
/* A small off-white badge with a red dot, shown on a chip/toggle whose last
   write is still failed. The red here is a deliberate, narrow exception to
   "red = exceeded ceiling only" — Kostas asked for it explicitly for this
   one case (a save that didn't go through), not as generic error styling. */
function unsavedBadge(k){
  return (W[k] && W[k].failed) ? el('span',{class:'unsaved','aria-label':'Not saved — will retry'}) : null;
}
window.addEventListener('online', ()=>{
  const keys=Object.keys(W).filter(k=>W[k].failed && !W[k].busy);
  if(!keys.length) return;
  keys.forEach(k=>runWrite(k));
  /* Writes optimistically updated S already; once every retry settles,
     one full redraw clears (or keeps) each chip's badge to match. */
  Promise.all(keys.map(k=>W[k].done)).then(draw);
});
function cnt(id, dk){ return (S.logs[dk] && S.logs[dk][id]) || 0; }
/* Updates S synchronously so the UI can repaint in the same task as the tap;
   the network write goes out behind it. */
function setLog(id, dk, count){
  if(!S.logs[dk]) S.logs[dk]={};
  S.logs[dk][id]=count;
  return pushWrite('log:'+id+':'+dk, count, async v=>{
    const upd=await api('logs?entry_type_id=eq.'+id+'&date=eq.'+dk,
      {method:'PATCH', headers:{Prefer:'return=representation'}, body:{count:v}});
    if(!upd.length) await api('logs',{method:'POST', headers:{Prefer:'return=minimal'},
      body:{entry_type_id:id, date:dk, count:v}});
  });
}
function periodRange(t, d){
  if(t.period==='day') return [d,d];
  if(t.period==='week') return [mondayOf(d), addDays(mondayOf(d),6)];
  return [monthStart(d), monthEnd(d)];
}
function sumRange(id,a,b){ let s=0; let x=new Date(a); while(x<=b){ s+=cnt(id,key(x)); x=addDays(x,1); } return s; }
function periodTot(t,d){ const r=periodRange(t,d); return sumRange(t.id,r[0],r[1]); }
function isCeil(t){ return t.kind==='ceiling'; }
function periodLabel(p){ return p==='day'?'today':(p==='week'?'this wk':'this mo'); }
async function getRefl(wk){
  if(S.refl[wk]!==undefined) return S.refl[wk];
  const rows=await api('reflections?select=*&week_start=eq.'+wk);
  S.refl[wk]=rows[0]||{week_start:wk, score:0, note:''};
  return S.refl[wk];
}
/* Keyed on the week, not the field: score and note writes against a row that
   doesn't exist yet would otherwise each POST and duplicate it. */
function setRefl(wk, patch){
  const r = S.refl[wk] || (S.refl[wk]={week_start:wk, score:0, note:''});
  Object.assign(r, patch);
  return pushWrite('refl:'+wk, JSON.stringify([r.score, r.note]), async()=>{
    const body={score:r.score, note:r.note};
    const upd=await api('reflections?week_start=eq.'+wk,
      {method:'PATCH', headers:{Prefer:'return=representation'}, body:body});
    if(!upd.length) await api('reflections',{method:'POST', headers:{Prefer:'return=minimal'},
      body:Object.assign({week_start:wk}, body)});
  });
}

/* ---------- seed ---------- */
const SEED=[
  ['exercise','Exercise','floor','week',3,'\u{1F4AA}'], ['run','Run','floor','week',1,'\u{1F3C3}'],
  ['read','Read','binary','week',5,'\u{1F4D6}'], ['sleep','Slept 7h+','binary','week',7,'\u{1F634}'],
  ['takeout','Takeout','ceiling','week',2,'\u{1F961}'], ['latenight','Late night','ceiling','week',2,'\u{1F319}'],
];
async function seedIfEmpty(){
  if(S.types.length) return false;
  await api('entry_types',{method:'POST', headers:{Prefer:'return=minimal'},
    body:SEED.map((s,i)=>({slug:s[0], name:s[1], kind:s[2], period:s[3], target:s[4], icon:s[5]||null, sort:i}))});
  await loadTypes();
  return true;
}

/* ---------- shell ---------- */
const app=document.getElementById('app');
/* Emptying #app collapses the document height, which makes the browser clamp
   scrollY to 0 — so capture it first. Staying in the same view keeps your
   place; switching tabs starts at the top. */
let shownView=null;
function shell(content){
  const y = shownView===S.view ? window.scrollY : 0;
  app.innerHTML='';
  app.appendChild(el('div',{class:'topbar'},
    el('h1',null,'Ledger'),
    el('div',{class:'nav'}, navButtons())
  ));
  content.forEach(c=>app.appendChild(c));
  app.appendChild(el('div',{class:'tabbar'},
    tab('day','Day'), tab('week','Week'), tab('month','Month'), tab('manage','Entries')
  ));
  shownView=S.view;
  if(window.scrollY!==y) window.scrollTo(0,y);
}
function tab(v,label){
  return el('button',{class:S.view===v?'on':'', onclick:()=>{ S.view=v; render(); }}, label);
}
function navButtons(){
  const t=todayD();
  if(S.view==='day'){
    return [
      !sameDay(S.date,t)?el('button',{class:'today', onclick:()=>{S.date=todayD(); render();}},'Today'):null,
      el('button',{'aria-label':'Previous day', onclick:()=>{S.date=addDays(S.date,-1); render();}},'\u2039'),
      el('button',{'aria-label':'Next day', disabled:key(S.date)>=key(t), onclick:()=>{S.date=addDays(S.date,1); render();}},'\u203A'),
    ];
  }
  if(S.view==='week'){
    return [
      el('button',{'aria-label':'Previous week', onclick:()=>{S.date=addDays(mondayOf(S.date),-7); render();}},'\u2039'),
      el('button',{'aria-label':'Next week', disabled:addDays(mondayOf(S.date),7)>t, onclick:()=>{S.date=addDays(mondayOf(S.date),7); render();}},'\u203A'),
    ];
  }
  if(S.view==='month'){
    return [
      el('button',{'aria-label':'Previous month', onclick:()=>{S.date=new Date(S.date.getFullYear(),S.date.getMonth()-1,1); render();}},'\u2039'),
      el('button',{'aria-label':'Next month', disabled:new Date(S.date.getFullYear(),S.date.getMonth()+1,1)>t, onclick:()=>{S.date=new Date(S.date.getFullYear(),S.date.getMonth()+1,1); render();}},'\u203A'),
    ];
  }
  return [];
}

/* ---------- day view ---------- */
function renderDayView(){
  const d=S.date, dk=key(d), t=todayD();
  const title=sameDay(d,t)?'Today':(DAYS[(d.getDay()+6)%7]);
  const dateInp=el('input',{type:'date', value:dk, max:key(t),
    onchange:e=>{ const v=e.target.value; if(v){ S.date=parseKey(v); render(); } }});
  const head=el('div',{class:'viewhead'},
    el('h2',null,title+', '+d.getDate()+' '+MON[d.getMonth()]), dateInp);

  const act=S.types.filter(x=>x.active);
  const bins=act.filter(x=>x.kind==='binary');
  const floors=act.filter(x=>x.kind==='floor');
  const ceils=act.filter(x=>x.kind==='ceiling');

  /* Each entry is its own live region: nothing outside a toggle or chip reads
     its count, so a tap redraws just that node and the page never moves. */
  const togs=el('div',{class:'toggles'}, bins.map(b=>live(redraw=>{
    const on=cnt(b.id,dk)>0;
    const tot=periodTot(b,d);
    return el('button',{class:'tog','aria-pressed':String(on), onclick:()=>{ setLog(b.id,dk,on?0:1).then(redraw); redraw(); }},
      el('span',{class:'box'},'\u2713'), b.name,
      b.icon?el('span',{class:'icon'},b.icon):null,
      el('span',{class:'sub'}, tot+'/'+b.target+' '+periodLabel(b.period)),
      unsavedBadge('log:'+b.id+':'+dk));
  })));

  function chip(x, redraw){
    const n=cnt(x.id,dk), tot=periodTot(x,d), T=x.target;
    const over=isCeil(x)&&tot>T, met=!isCeil(x)&&tot>=T;
    const c=el('div',{class:'chip'+(over?' over':'')+(met?' met':'')});
    if(n>0) c.appendChild(el('button',{class:'minus','aria-label':'Remove one '+x.name,
      onclick:e=>{ e.stopPropagation(); setLog(x.id,dk,Math.max(0,n-1)).then(redraw); redraw(); }},'\u2013'));
    c.appendChild(el('button',{class:'lbl', onclick:()=>{ setLog(x.id,dk,n+1).then(redraw); redraw(); }},
      el('span',{class:'txt'}, el('span',null, x.name, x.icon?el('span',{class:'icon'},x.icon):null),
        el('span',{class:'prog'}, tot+'/'+T+' '+periodLabel(x.period)+(isCeil(x)?' max':''))),
      n>0?el('span',{class:'n'},String(n)):null));
    const badge=unsavedBadge('log:'+x.id+':'+dk);
    if(badge) c.appendChild(badge);
    return c;
  }
  const chipFor=x=>live(redraw=>chip(x, redraw));

  return [head,
    bins.length?el('section',null, el('div',{class:'head'},el('h2',null,'Daily'),el('span',{class:'sub'},'tap = done')), togs):null,
    floors.length?el('section',null, el('div',{class:'head'},el('h2',null,'Counters')), el('div',{class:'chips'}, floors.map(chipFor))):null,
    ceils.length?el('section',null, el('div',{class:'head'},el('h2',null,'Budgets')), el('div',{class:'chips'}, ceils.map(chipFor))):null,
  ].filter(Boolean);
}

/* ---------- week view ---------- */
function renderWeekView(refl){
  const ws=mondayOf(S.date), we=addDays(ws,6), t=todayD();
  const head=el('div',{class:'viewhead'},
    el('h2',null, ws.getDate()+(ws.getMonth()===we.getMonth()?'':' '+MON[ws.getMonth()])+'\u2013'+we.getDate()+' '+MON[we.getMonth()]),
    el('span',{class:'sub'}, 'W'+isoWeek(ws)));

  const act=S.types.filter(x=>x.active && x.period!=='month');
  const floors=act.filter(x=>!isCeil(x));
  const ceils=act.filter(isCeil);
  function weekTarget(x){ return x.period==='day' ? x.target*7 : x.target; }
  function weekTot(x){ return sumRange(x.id, ws, we); }

  const met=floors.filter(x=>weekTot(x)>=weekTarget(x)).length;
  const over=ceils.filter(x=>weekTot(x)>weekTarget(x));
  const st=el('p',{class:'status'+(over.length?' alarm':''),
    html:'<b>'+met+' of '+floors.length+'</b> floors met. '+(over.length
      ?'<span class="bad">'+over.length+' ceiling'+(over.length>1?'s':'')+' crossed \u2014 '
        +over.map(x=>x.name.toLowerCase()).join(', ')+'.</span>'
      :'Every ceiling still holding.')});

  const strip=el('div',{class:'daystrip'}, DL.map((L,i)=>{
    const dd=addDays(ws,i);
    return el('button',{class:sameDay(dd,S.date)?'on':'', disabled:dd>t,
      onclick:()=>{ S.date=dd; S.view='day'; render(); }}, L+' '+dd.getDate());
  }));

  function rowsFor(list, ceil){
    return el('div',null, list.map(x=>{
      const tot=weekTot(x), T=weekTarget(x), ov=ceil&&tot>T;
      const dots=el('div',{class:'dots'}, [0,1,2,3,4,5,6].map(i=>{
        const dd=addDays(ws,i); let cls='';
        if(cnt(x.id,key(dd))>0) cls=ceil?(ov?'bad':'onx'):'on';
        if(sameDay(dd,t)) cls+=' today';
        return el('i',{class:cls.trim()});
      }));
      const tal=ceil
        ? el('div',{class:'tally'+(T-tot<0?' over':'')}, T-tot<0?(tot-T)+' over':(T-tot)+' left')
        : el('div',{class:'tally'+(tot>=T?' met':'')}, tot+' / '+T);
      return el('div',{class:'row'}, el('div',{class:'name'}, el('span',{class:'nametext'},x.name), x.icon?el('span',{class:'icon'},x.icon):null), dots, tal);
    }));
  }

  /* Only these five buttons read the score, and keeping the textarea outside
     the live region is what stops a score tap from rebuilding it mid-sentence. */
  const scale=live(redraw=>el('div',{class:'scale'}, [1,2,3,4,5].map(n=>
    el('button',{'aria-pressed':String(refl.score===n),
      onclick:()=>{ setRefl(key(ws), {score: refl.score===n?0:n}); redraw(); }}, String(n)))));
  let noteTimer=null;
  /* State updates on every keystroke, only the network write is debounced —
     otherwise a re-render inside the debounce window would repaint stale text
     over what was just typed. */
  const note=el('textarea',{placeholder:'One thing to change next week',
    oninput:e=>{ refl.note=e.target.value; clearTimeout(noteTimer);
      noteTimer=setTimeout(()=>setRefl(key(ws),{note:refl.note}), 500); }});
  note.value=refl.note||'';

  return [head, st, strip,
    el('section',null, el('div',{class:'head'},el('h2',null,'Floors')), rowsFor(floors,false)),
    el('section',null, el('div',{class:'head'},el('h2',null,'Ceilings'),el('span',{class:'sub'},"what's left")), rowsFor(ceils,true)),
    el('section',null, el('div',{class:'head'},el('h2',null,'Sunday'),el('span',{class:'sub'},'not scored')),
      el('p',{class:'ask'},'Were you actually present with the people who matter this week?'),
      scale, el('div',{class:'scalekey'}, el('span',null,'Barely there'), el('span',null,'Fully there')), note),
  ];
}
function isoWeek(d){
  const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const dn=x.getUTCDay()||7; x.setUTCDate(x.getUTCDate()+4-dn);
  const y0=new Date(Date.UTC(x.getUTCFullYear(),0,1));
  return Math.ceil((((x-y0)/86400000)+1)/7);
}

/* ---------- month view ---------- */
let expanded=null;
function renderMonthView(){
  const ms=monthStart(S.date), me=monthEnd(S.date), t=todayD(), dim=me.getDate();
  const head=el('div',{class:'viewhead'},
    el('h2',null, MONF[ms.getMonth()]+' '+ms.getFullYear()),
    el('span',{class:'sub'}, dim+' days'));
  function mTarget(x){
    if(x.period==='day') return x.target*dim;
    if(x.period==='week') return Math.round(x.target*dim/7);
    return x.target;
  }
  const act=S.types.filter(x=>x.active);
  const floors=act.filter(x=>!isCeil(x)), ceils=act.filter(isCeil);

  function heat(x){
    const grid=el('div',{class:'grid'}, DL.map(L=>el('div',{class:'cell dow'},L)));
    const off=(ms.getDay()+6)%7;
    for(let i=0;i<off;i++) grid.appendChild(el('div',{class:'cell out'}));
    for(let day=1;day<=dim;day++){
      const dd=new Date(ms.getFullYear(),ms.getMonth(),day);
      const c=cnt(x.id,key(dd));
      const cell=el('div',{class:'cell'+(c>0?(isCeil(x)?' hx':' h'):'')}, c>1?String(c):'');
      if(dd<=t){ cell.style.cursor='pointer'; cell.onclick=()=>{ S.date=dd; S.view='day'; render(); }; }
      grid.appendChild(cell);
    }
    return el('div',{class:'heat'}, grid);
  }
  function rowsFor(list, ceil){
    return el('div',null, list.map(x=>{
      const tot=sumRange(x.id,ms,me), T=mTarget(x), ov=ceil&&tot>T;
      const approx=x.period==='week'?'~':'';
      const tal=ceil
        ? el('div',{class:'tally'+(ov?' over':'')}, ov?(tot-T)+' over':tot+' / '+approx+T+' max')
        : el('div',{class:'tally'+(tot>=T?' met':'')}, tot+' / '+approx+T);
      const r=el('div',{class:'row tap', onclick:()=>{ expanded=expanded===x.id?null:x.id; render(); }},
        el('div',{class:'name'}, el('span',{class:'nametext'},x.name), x.icon?el('span',{class:'icon'},x.icon):null), tal);
      return el('div',null, r, expanded===x.id?heat(x):null);
    }));
  }
  return [head,
    el('section',null, el('div',{class:'head'},el('h2',null,'Floors'),el('span',{class:'sub'},'tap a row for the calendar')), rowsFor(floors,false)),
    el('section',null, el('div',{class:'head'},el('h2',null,'Ceilings')), rowsFor(ceils,true)),
  ];
}

/* ---------- manage view ---------- */
function renderManageView(){
  const head=el('div',{class:'viewhead'}, el('h2',null,'Entries'),
    el('button',{class:'headbtn', onclick:()=>{ S.editingId='new'; render(); }},'+ New'));
  const out=[head];

  if(S.firstRun){
    out.push(el('p',{class:'status'},
      'These six are placeholders so you can see how it works. Edit them, archive them, '
      + 'or add your own \u2014 three shapes: counter (at least N), budget (at most N), yes/no.'));
  }

  if(S.editingId){
    const ed=S.editingId==='new'?{name:'',kind:'floor',period:'week',target:1,active:true,icon:''}:S.types.find(x=>x.id===S.editingId);
    const nameI=el('input',{type:'text', value:ed.name, placeholder:'Name'});
    const iconI=el('input',{type:'text', value:ed.icon||'', placeholder:'\u{1F60A}', maxlength:'8'});
    const kindS=el('select',null,
      el('option',{value:'floor'},'Counter \u2014 at least N per period'),
      el('option',{value:'ceiling'},'Budget \u2014 at most N per period'),
      el('option',{value:'binary'},'Yes / no per day'));
    kindS.value=ed.kind;
    const perS=el('select',null,
      el('option',{value:'day'},'per day'),
      el('option',{value:'week'},'per week'),
      el('option',{value:'month'},'per month'));
    perS.value=ed.period;
    const tgtI=el('input',{type:'number', inputmode:'numeric', min:'0', max:'99', value:String(ed.target)});
    const msg=el('p',{class:'msg'});
    async function saveType(){
      const name=nameI.value.trim();
      if(!name){ msg.textContent='Name required.'; msg.className='msg err'; return; }
      const body={name:name, kind:kindS.value, period:perS.value, target:Math.max(0,+tgtI.value||0), icon:iconI.value.trim()||null};
      try{
        if(S.editingId==='new'){
          body.slug=name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||('e'+Date.now());
          body.sort=S.types.length;
          await api('entry_types',{method:'POST', headers:{Prefer:'return=minimal'}, body:body});
        } else {
          await api('entry_types?id=eq.'+S.editingId,{method:'PATCH', headers:{Prefer:'return=minimal'}, body:body});
        }
        S.editingId=null; await loadTypes(); render();
      }catch(e){ msg.textContent=e.message; msg.className='msg err'; }
    }
    async function archiveType(on){
      try{ await api('entry_types?id=eq.'+S.editingId,{method:'PATCH', headers:{Prefer:'return=minimal'}, body:{active:on}});
        S.editingId=null; await loadTypes(); render();
      }catch(e){ msg.textContent=e.message; msg.className='msg err'; }
    }
    out.push(el('div',{class:'form'},
      el('div',{class:'formrow'},
        el('label',{class:'grow'},'Name', nameI),
        el('label',{class:'iconfield'},'Icon', iconI)),
      el('label',null,'Type', kindS),
      el('label',null,'Period', perS),
      el('label',null,'Target', tgtI),
      el('div',{class:'btnrow'},
        el('button',{class:'pri', onclick:saveType},'Save'),
        el('button',{onclick:()=>{ S.editingId=null; render(); }},'Cancel'),
        S.editingId!=='new' ? el('button',{class:'danger', onclick:()=>archiveType(!ed.active)}, ed.active?'Archive':'Restore') : null),
      el('p',{class:'mut'},'Archiving hides an entry from logging but keeps all its history. Changing the type or target re-scores past periods too \u2014 history is stored as raw counts.'),
      msg));
  }

  const list=S.types.filter(x=>S.showArchived?!x.active:x.active);
  out.push(el('section',null,
    el('div',{class:'head'},
      el('h2',null,S.showArchived?'Archived':'Active'),
      el('button',{class:'headbtn', onclick:()=>{ S.showArchived=!S.showArchived; render(); }},
        S.showArchived?'Show active':'Show archived')),
    el('div',null, list.map(x=>
      el('div',{class:'row tap', onclick:()=>{ S.editingId=x.id; render(); window.scrollTo(0,0); }},
        el('div',{class:'name'}, el('span',{class:'nametext'},x.name), x.icon?el('span',{class:'icon'},x.icon):null),
        el('div',{class:'tally'},
          (x.kind==='binary'?'yes/no':(x.kind==='floor'?'\u2265':'\u2264')+x.target)+' \u00B7 '+x.period))))));

  /* One JSON file with everything this account owns — entry types, every
     daily log (resolved to the entry's slug, not its opaque id, so the file
     reads on its own), and weekly reflections. Logs/reflections aren't
     limited to what S has cached for the currently-viewed months; this
     fetches the full history fresh. RLS already scopes every query to the
     signed-in user, so no explicit filtering needed here. */
  const expMsg=el('p',{class:'msg'});
  async function runExport(){
    expMsg.className='msg'; expMsg.textContent='Preparing export…';
    try{
      const [logs, refl] = await Promise.all([
        api('logs?select=entry_type_id,date,count,note'),
        api('reflections?select=week_start,score,note')
      ]);
      const slugFor={}; S.types.forEach(x=>{ slugFor[x.id]=x.slug; });
      const data={
        exported_at: new Date().toISOString(),
        app: 'ledger',
        entry_types: S.types.map(x=>({slug:x.slug, name:x.name, kind:x.kind, period:x.period, target:x.target, icon:x.icon||null, active:x.active, sort:x.sort})),
        logs: logs.map(r=>({entry_type_slug: slugFor[r.entry_type_id]||null, date:r.date, count:r.count, note:r.note||null})),
        reflections: refl
      };
      const blob=new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=el('a',{href:url, download:'ledger-export-'+key(todayD())+'.json'});
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      expMsg.textContent='Downloaded '+logs.length+' logs, '+refl.length+' weekly reflections.';
    }catch(e){ expMsg.textContent=e.message; expMsg.className='msg err'; }
  }
  out.push(el('section',null,
    el('div',{class:'head'},el('h2',null,'Export your data')),
    el('p',{class:'mut'},'Everything you’ve logged — entries, daily counts, notes, and weekly reflections — as one file you can keep.'),
    el('div',{class:'btnrow'}, el('button',{onclick:runExport},'Download my data')), expMsg));

  const impT=el('textarea',{placeholder:'Paste the JSON export from the old tracker'});
  const impMsg=el('p',{class:'msg'});
  async function runImport(){
    let d; try{ d=JSON.parse(impT.value); }catch(e){ impMsg.textContent='Not valid JSON.'; impMsg.className='msg err'; return; }
    if(!d||!d.weeks){ impMsg.textContent='Not a tracker export.'; impMsg.className='msg err'; return; }
    const bySlug={}; S.types.forEach(x=>bySlug[x.slug]=x);
    let nLogs=0;
    impMsg.className='msg'; impMsg.textContent='Importing\u2026';
    try{
      for(const wk in d.weeks){
        const w=d.weeks[wk];
        for(const slug in (w.counts||{})){
          const ty=bySlug[slug]; if(!ty) continue;
          const arr=w.counts[slug]||[];
          for(let i=0;i<7;i++) if(arr[i]>0){ await setLog(ty.id, key(addDays(parseKey(wk),i)), arr[i]); nLogs++; }
        }
        if(w.score||w.note){ await getRefl(wk); await setRefl(wk,{score:w.score||0, note:w.note||''}); }
      }
      if(d.targets) for(const slug in d.targets){
        const ty=bySlug[slug];
        if(ty) await api('entry_types?id=eq.'+ty.id,{method:'PATCH', headers:{Prefer:'return=minimal'}, body:{target:d.targets[slug]}});
      }
      await loadTypes();
      impMsg.textContent='Imported '+nLogs+' logs.';
    }catch(e){ impMsg.textContent=e.message; impMsg.className='msg err'; }
  }
  out.push(el('section',null,
    el('div',{class:'head'},el('h2',null,'Import old data')),
    impT, el('div',{class:'btnrow'}, el('button',{onclick:runImport},'Import')), impMsg));

  out.push(el('section',null,
    el('div',{class:'head'},el('h2',null,'Account'),
      el('span',{class:'sub'}, ((sess()&&sess().user&&sess().user.email)||'')+' \u00B7 '+ENV_NAME)),
    el('div',{class:'btnrow'}, el('button',{onclick:()=>{ setSess(null); boot(); }},'Sign out'))));
  return out;
}

/* ---------- auth view ---------- */
function renderAuth(){
  app.innerHTML='';
  let forgot=false;
  const email=el('input',{type:'email', placeholder:'Email', autocomplete:'username',
    oninput:e=>localStorage.setItem(LAST_EMAIL_KEY, e.target.value)});
  email.value=localStorage.getItem(LAST_EMAIL_KEY)||'';
  const pw=el('input',{type:'password', placeholder:'Password', autocomplete:'current-password'});
  const msg=el('p',{class:'msg'});
  async function go(signup){
    msg.className='msg'; msg.textContent=signup?'Creating account\u2026':'Signing in\u2026';
    try{
      if(signup){
        const d=await authReq('signup',{email:email.value.trim(), password:pw.value});
        if(d.access_token){ setSess(d); boot(); }
        else { msg.textContent='Account created \u2014 confirm via the email you just got, then sign in.'; }
      } else {
        const d=await authReq('token?grant_type=password',{email:email.value.trim(), password:pw.value});
        setSess(d); boot();
      }
    }catch(e){
      var m=String(e.message||'');
      if(m.indexOf('not_invited')>=0 || m.indexOf('Database error saving new user')>=0)
        m='That email is not on the beta list.';
      msg.textContent=m; msg.className='msg err';
    }
  }
  async function sendReset(){
    msg.className='msg'; msg.textContent='Sending reset link\u2026';
    try{
      await authReq('recover?redirect_to='+encodeURIComponent(location.origin+location.pathname),
        {email:email.value.trim()});
      msg.textContent='Check your email for a reset link.';
    }catch(e){ msg.textContent=e.message; msg.className='msg err'; }
  }
  function draw2(){
    app.innerHTML='';
    app.appendChild(el('div',{class:'auth'},
      el('h1',null,'Ledger'),
      email,
      forgot ? null : pw,
      forgot
        ? el('div',{class:'btnrow'},
            el('button',{class:'pri', onclick:sendReset},'Send reset link'),
            el('button',{onclick:()=>{ forgot=false; msg.className='msg'; msg.textContent=''; draw2(); }},'Back'))
        : el('div',{class:'btnrow'},
            el('button',{class:'pri', onclick:()=>go(false)},'Sign in'),
            el('button',{onclick:()=>go(true)},'Create account')),
      forgot ? null : el('button',{class:'authlink', onclick:()=>{ forgot=true; msg.className='msg'; msg.textContent=''; draw2(); }},'Forgot password?'),
      msg));
  }
  draw2();
}

/* ---------- password reset (arrived here via a Supabase recovery link) ---------- */
function renderResetPassword(rec){
  app.innerHTML='';
  const pw=el('input',{type:'password', placeholder:'New password', autocomplete:'new-password'});
  const pw2=el('input',{type:'password', placeholder:'Confirm new password', autocomplete:'new-password'});
  const msg=el('p',{class:'msg'});
  async function go(){
    if(pw.value.length<6){ msg.textContent='Password must be at least 6 characters.'; msg.className='msg err'; return; }
    if(pw.value!==pw2.value){ msg.textContent='Passwords don\u2019t match.'; msg.className='msg err'; return; }
    msg.className='msg'; msg.textContent='Saving\u2026';
    try{
      await authPut('user', {password:pw.value}, rec.access_token);
      S.recovery=null; setSess(rec); boot();
    }catch(e){ msg.textContent=e.message; msg.className='msg err'; }
  }
  app.appendChild(el('div',{class:'auth'},
    el('h1',null,'Set new password'), pw, pw2,
    el('div',{class:'btnrow'}, el('button',{class:'pri', onclick:go},'Save password')),
    msg));
}

/* ---------- boot + render ---------- */
/* The date span the current view reads. Day needs its own month as well as its
   week, which can straddle two months. */
function viewSpan(){
  const d=S.date;
  if(S.view==='week'){ const ws=mondayOf(d); return [ws, addDays(ws,6)]; }
  if(S.view==='month') return [monthStart(d), monthEnd(d)];
  return [minD(monthStart(d), mondayOf(d)), maxD(monthEnd(d), addDays(mondayOf(d),6))];
}
function minD(a,b){ return a<b?a:b; }
function maxD(a,b){ return a>b?a:b; }
function dataReady(){
  if(S.view==='manage') return true;
  const s=viewSpan(), x=new Date(s[0].getFullYear(), s[0].getMonth(), 1);
  while(x<=s[1]){ if(!S.loaded.has(monthKeyOf(x))) return false; x.setMonth(x.getMonth()+1); }
  return S.view!=='week' || S.refl[key(mondayOf(S.date))]!==undefined;
}
function draw(){
  if(S.view==='day') shell(renderDayView());
  else if(S.view==='week'){ const wk=key(mondayOf(S.date));
    shell(renderWeekView(S.refl[wk] || {week_start:wk, score:0, note:''})); }
  else if(S.view==='month') shell(renderMonthView());
  else shell(renderManageView());
}
/* Draws straight away when the data is already cached \u2014 same task as the tap,
   no await, no yield. Otherwise the current screen stays put (never blanked,
   never drawn with missing numbers) until the fetch lands. */
function render(){
  if(dataReady()){ draw(); return; }
  const tok=++S.renderToken;
  const s=viewSpan();
  busy(true);
  Promise.all([ensureRange(s[0], s[1])].concat(S.view==='week'?[getRefl(key(mondayOf(S.date)))]:[]))
    .then(()=>{ if(tok===S.renderToken) draw(); })
    .catch(e=>toast(navigator.onLine===false ? 'Offline — can’t load that yet.' : e.message))
    .then(()=>busy(false));
}
async function boot(){
  if(S.recovery){ renderResetPassword(S.recovery); return; }
  if(!sess()){ renderAuth(); return; }
  draw();                       // app chrome on the first frame, not a blank page
  busy(true);
  try{
    const s=viewSpan();
    await Promise.all([loadTypes(), ensureRange(s[0], s[1])]);
    S.firstRun = await seedIfEmpty();
    if(S.firstRun) S.view='manage';
    draw();
  }catch(e){
    if(String(e.message).indexOf('signed out')>=0){ renderAuth(); }
    else {
      /* A network blip here isn't a reason to sign the user out of the UI —
         keep the chrome up and pick the load back up once we're online. */
      toast(navigator.onLine===false ? 'Offline — reconnect to load your data.' : e.message);
      window.addEventListener('online', boot, {once:true});
    }
  }
  busy(false);
}
boot();
</script>
